# audio integration endpoints
# Auto-generated from route-owned Zod schemas

# USAGE: import { mcapi } from '@spaces/sdk'
#   mcapi.post('/endpoint', { ...params })
#   mcapi.get('/endpoint', { ...params })

tools:

  text_to_speech:
    method: POST
    endpoint: /text-to-speech
    description: "Convert text to speech audio"
    input_schema:
      type: object
      properties:
        text:
          type: string
          minLength: 1
        model:
          type: string
        voice:
          type: string
        response_format:
          type: string
          enum:
            - mp3
            - opus
            - aac
            - flac
        speed:
          type: number
          minimum: 0.25
          maximum: 4
      required:
        - text
    output:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            audioUrl:
              type: string
          additionalProperties: false
        error:
          type: string
      required:
        - success

  elevenlabs_text_to_speech:
    method: POST
    endpoint: /elevenlabs-text-to-speech
    description: "Convert text to speech using ElevenLabs (high-quality, expressive voices)"
    input_schema:
      type: object
      properties:
        text:
          type: string
          minLength: 1
        voice_id:
          type: string
        model_id:
          type: string
        output_format:
          type: string
        voice_settings:
          type: object
          properties:
            stability:
              type: number
              minimum: 0
              maximum: 1
            similarity_boost:
              type: number
              minimum: 0
              maximum: 1
            style:
              type: number
              minimum: 0
              maximum: 1
            use_speaker_boost:
              type: boolean
          additionalProperties: false
      required:
        - text
    output:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            audioUrl:
              type: string
            voice_id:
              type: string
            model_id:
              type: string
          additionalProperties: false
        error:
          type: string
      required:
        - success

  elevenlabs_create_agent:
    method: POST
    endpoint: /elevenlabs-create-agent
    description: "Create an ElevenLabs Conversational AI agent"
    input_schema:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        prompt:
          type: string
          minLength: 1
        firstMessage:
          type: string
          minLength: 1
        voiceId:
          type: string
          minLength: 1
        nativeLanguage:
          type: string
          minLength: 1
        targetLanguage:
          type: string
          minLength: 1
        clientTools:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              description:
                type: string
              parameters:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    type:
                      type: string
                    description:
                      type: string
                    required:
                      type: boolean
                  required:
                    - type
                    - description
                  additionalProperties: false
              wait_for_response:
                type: boolean
            required:
              - name
              - description
              - parameters
            additionalProperties: false
      required:
        - name
        - prompt
        - firstMessage
        - voiceId
        - nativeLanguage
        - targetLanguage
    output:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            agent_id:
              type: string
          additionalProperties: false
        error:
          type: string
      required:
        - success

  elevenlabs_signed_url:
    method: POST
    endpoint: /elevenlabs-signed-url
    description: "Get a signed URL for ElevenLabs Conversational AI session"
    input_schema:
      type: object
      properties:
        agent_id:
          type: string
          minLength: 1
      required:
        - agent_id
    output:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            signed_url:
              type: string
          additionalProperties: false
        error:
          type: string
      required:
        - success

  speech_to_text:
    method: POST
    endpoint: /speech-to-text
    description: "Transcribe speech audio to text"
    input_schema:
      type: object
      properties:
        audio:
          type: string
          minLength: 1
        model:
          type: string
        language:
          type: string
        prompt:
          type: string
        response_format:
          type: string
        temperature:
          type: number
          minimum: 0
          maximum: 1
      required:
        - audio
    output:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            text:
              type: string
          additionalProperties: false
        error:
          type: string
      required:
        - success
