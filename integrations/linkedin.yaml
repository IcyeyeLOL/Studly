        name:
          type: string
        company:
          type: string
        title:
          type: string
        education:
          type: string
        location:
          type: string
        page:
          type: integer
    output:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            profiles:
              type: array
              items:
