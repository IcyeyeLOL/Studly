# document integration endpoints
# Auto-generated from route-owned Zod schemas

# USAGE: import { mcapi } from '@spaces/sdk'
#   mcapi.post('/endpoint', { ...params })
#   mcapi.get('/endpoint', { ...params })

tools:

  convert_file:
    method: POST
    endpoint: /convert-file
    description: "Convert a file by URL or base64"
    input_schema:
      type: object
      properties:
        input_format:
          type: string
          minLength: 1
        output_format:
          type: string
          minLength: 1
        file:
          type: string
        url:
          type: string
          format: uri
      required:
        - input_format
        - output_format
    output:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            url:
              type: string
          additionalProperties: false
        error:
          type: string
      required:
        - success

  extract_document_text:
    method: POST
    endpoint: /extract-document-text
    description: "Extract text from a PDF or Word document (base64 input)"
    input_schema:
      type: object
      properties:
        file:
          type: string
          minLength: 1
        filename:
          type: string
      required:
        - file
    output:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            text:
              type: string
            fileType:
              type: string
          additionalProperties: false
        error:
          type: string
      required:
        - success

  generate_tasks_from_document:
    method: POST
    endpoint: /generate-tasks-from-document
    description: "Generate structured travel tasks from extracted document text"
    input_schema:
      type: object
      properties:
        text:
          type: string
          minLength: 1
        availableCategories:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                minLength: 1
              name:
                type: string
                minLength: 1
            required:
              - id
              - name
            additionalProperties: false
      required:
        - text
        - availableCategories
    output:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            tasks:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  description:
                    type: string
                  categoryId:
                    type: string
                  dueDate:
                    type: string
                required:
                  - id
                  - name
                  - description
                  - categoryId
                additionalProperties: false
          additionalProperties: false
        error:
          type: string
      required:
        - success

  latex_compile:
    method: POST
    endpoint: /latex-compile
    description: "Compile a multi-file LaTeX project to PDF. Supports pdflatex/xelatex/lualatex, inline content, base64 files, URL resources, and bibliography processing. Returns the compiled PDF as base64."
    input_schema:
      type: object
      properties:
        compiler:
          type: string
          enum:
            - pdflatex
            - xelatex
            - lualatex
            - platex
            - uplatex
            - context
          default: pdflatex
          description: LaTeX compiler to use. Defaults to pdflatex.
        resources:
          type: array
          items:
            type: object
            properties:
              main:
                type: boolean
                description: Mark as the main .tex document (exactly one resource must have this when multiple resources are provided).
              path:
                type: string
                description: "Relative path for non-main resources (e.g. \"images/logo.png\", \"refs.bib\"). Required for all non-main resources."
              content:
                type: string
                description: "Inline LaTeX string content. Use this for the main .tex document (the one marked with main: true). For other resources, use \"file\" instead."
              file:
                type: string
                description: "Base64-encoded file content. Use this for all non-main resources: .bib files, .sty files, images (PNG/JPG/etc), fonts, and any other binary or text files. The main .tex document should use \"content\" instead."
              url:
                type: string
                format: uri
                description: URL to fetch the resource from. Alternative to content/file for external resources.
            additionalProperties: false
          minItems: 1
          description: "Array of project resources. Exactly one must be the main .tex document. Practical rule: main .tex uses \"content\", all other resources (.bib, .sty, images, fonts, etc.) use \"file\" (base64) and must include \"path\"."
        options:
          type: object
          properties:
            bibliography:
              type: object
              properties:
                command:
                  type: string
                  enum:
                    - bibtex
                    - biber
                  description: Bibliography processor. Defaults to bibtex.
              additionalProperties: false
            compiler:
              type: object
              properties:
                halt_on_error:
                  type: boolean
                  description: "Stop on first error (-halt-on-error). Defaults to false."
                silent:
                  type: boolean
                  description: "Non-verbose mode (-interaction=batchmode). Defaults to false."
              additionalProperties: false
          additionalProperties: false
          description: Compilation options for bibliography and compiler behaviour.
      required:
        - resources
    output:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            compiled:
              type: boolean
              description: Whether the compiler produced a PDF. False when compilation errors prevented output.
            pdfBase64:
              type: string
              description: "Base64-encoded compiled PDF. Present only when compiled is true."
            contentType:
              type: string
              description: MIME type (application/pdf)
            compilationLog:
              type: string
              description: Raw LaTeX compilation log output
            parsedLog:
              type: object
              properties:
                errors:
                  type: array
                  items:
                    type: object
                    properties:
                      info:
                        type: object
                        additionalProperties: {}
                        description: Error details — always has "type" and "message", may include "package", "lines", etc.
                      context:
                        type: string
                    required:
                      - info
                      - context
                    additionalProperties: false
                warnings:
                  type: array
                  items:
                    type: object
                    properties:
                      info:
                        type: object
                        additionalProperties: {}
                      context:
                        type: string
                    required:
                      - info
                      - context
                    additionalProperties: false
                badboxes:
                  type: array
                  items:
                    type: object
                    properties:
                      info:
                        type: object
                        additionalProperties: {}
                      context:
                        type: string
                    required:
                      - info
                      - context
                    additionalProperties: false
                missing_refs:
                  type: array
                  items:
                    type: object
                    properties:
                      info:
                        type: object
                        additionalProperties: {}
                      context:
                        type: string
                    required:
                      - info
                      - context
                    additionalProperties: false
                errors_count:
                  type: number
                warnings_count:
                  type: number
                badboxes_count:
                  type: number
                has_errors:
                  type: boolean
                has_warnings:
                  type: boolean
              required:
                - errors
                - warnings
                - badboxes
                - missing_refs
                - errors_count
                - warnings_count
                - badboxes_count
                - has_errors
                - has_warnings
              additionalProperties: false
              description: Structured parsed log with categorised errors, warnings, badboxes, and missing references
            logFiles:
              type: object
              additionalProperties:
                type: string
              description: Map of log filename to its full content (e.g. "document.log" → content)
            duration:
              type: number
              description: Compilation duration in seconds
          required:
            - compiled
          additionalProperties: false
        error:
          type: string
      required:
        - success
