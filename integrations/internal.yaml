# internal integration endpoints
# Auto-generated from route-owned Zod schemas

# USAGE: Call using miyagiAPI:
#   miyagiAPI.post('/endpoint', { ...params })
#   miyagiAPI.get('/endpoint', { ...params })

tools:

  usage:
    method: GET
    endpoint: /usage
    description: "Get user integration spending summary"
    output:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            totalSpent:
              type: number
            currency:
              type: string
            usageCount:
              type: number
          required:
            - totalSpent
            - currency
            - usageCount
          additionalProperties: false
        error:
          type: string
      required:
        - success

  get_canvas_users:
    method: POST
    endpoint: /get-canvas-users
    description: "List users for a canvas room"
    input_schema:
      type: object
      properties:
        roomId:
          type: string
          minLength: 1
      required:
        - roomId
    output:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            data:
              type: object
              properties:
                users:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      publicUsername:
                        type: string
                      email:
                        type: string
                      isOwner:
                        type: boolean
                    required:
                      - id
                      - name
                      - publicUsername
                      - email
                      - isOwner
                    additionalProperties: false
              required:
                - users
              additionalProperties: false
          additionalProperties: false
        error:
          type: string
      required:
        - success

  get_current_user:
    method: POST
    endpoint: /get-current-user
    description: "Get current authenticated user"
    output:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            data:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    publicUsername:
                      type: string
                    email:
                      type: string
                    isCurrentUser:
                      type: boolean
                  required:
                    - id
                    - name
                    - publicUsername
                    - email
                    - isCurrentUser
                  additionalProperties: false
              required:
                - user
              additionalProperties: false
          additionalProperties: false
        error:
          type: string
      required:
        - success
