# video integration endpoints
# Auto-generated from route-owned Zod schemas

# USAGE: Call using miyagiAPI:
#   miyagiAPI.post('/endpoint', { ...params })
#   miyagiAPI.get('/endpoint', { ...params })

tools:

  generate_video:
    method: POST
    endpoint: /generate-video
    description: "Generate a video from an image and prompt"
    input_schema:
      type: object
      properties:
        image:
          type: string
          minLength: 1
        prompt:
          type: string
          minLength: 1
        duration:
          type: integer
          minimum: 1
          maximum: 60
      required:
        - image
        - prompt
    output:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            videoUrls:
              type: array
              items:
                type: string
            taskId:
              type: string
          additionalProperties: false
        error:
          type: string
      required:
        - success
