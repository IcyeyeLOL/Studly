# nasa integration endpoints
# Auto-generated from route-owned Zod schemas

# USAGE: Call using miyagiAPI:
#   miyagiAPI.post('/endpoint', { ...params })
#   miyagiAPI.get('/endpoint', { ...params })

tools:

  nasa_apod:
    method: POST
    endpoint: /nasa-apod
    description: "Get NASA Astronomy Picture of the Day. Supports single date, date range, or random count."
    input_schema:
      type: object
      properties:
        date:
          type: string
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
          description: "Specific date in YYYY-MM-DD format. Cannot be used with start_date/end_date or count."
        start_date:
          type: string
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
          description: "Start date for date range in YYYY-MM-DD format. Cannot be used with date or count."
        end_date:
          type: string
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
          description: "End date for date range in YYYY-MM-DD format. Used with start_date."
        count:
          type: integer
          minimum: 1
          maximum: 100
          description: Number of random APOD images to return. Cannot be used with date or start_date/end_date.
        thumbs:
          type: boolean
          description: "Return video thumbnail URL if APOD is a video. Default: false."
    output:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            apod:
              anyOf:
                - 
                  type: object
                  properties:
                    copyright:
                      type: string
                    date:
                      type: string
                    explanation:
                      type: string
                    hdurl:
                      type: string
                    media_type:
                      type: string
                    title:
                      type: string
                    url:
                      type: string
                    thumbnail_url:
                      type: string
                  required:
                    - date
                    - explanation
                    - media_type
                    - title
                    - url
                  additionalProperties: false
                - 
                  type: array
                  items:
                    type: object
                    properties:
                      copyright:
                        type: string
                      date:
                        type: string
                      explanation:
                        type: string
                      hdurl:
                        type: string
                      media_type:
                        type: string
                      title:
                        type: string
                      url:
                        type: string
                      thumbnail_url:
                        type: string
                    required:
                      - date
                      - explanation
                      - media_type
                      - title
                      - url
                    additionalProperties: false
          required:
            - apod
          additionalProperties: false
        error:
          type: string
      required:
        - success

  nasa_donki_cme:
    method: POST
    endpoint: /nasa-donki-cme
    description: "Get NASA DONKI Coronal Mass Ejection (CME) data. startDate defaults to 30 days prior, endDate defaults to current UTC date."
    input_schema:
      type: object
      properties:
        startDate:
          type: string
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
          description: "Start date in YYYY-MM-DD format. Defaults to 30 days prior to current UTC date."
        endDate:
          type: string
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
          description: "End date in YYYY-MM-DD format. Defaults to current UTC date."
    output:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            cme:
              type: array
              items:
                type: object
                properties: {}
                additionalProperties: true
          required:
            - cme
          additionalProperties: false
        error:
          type: string
      required:
        - success

