  nasa_neows_feed:
    method: POST
    endpoint: /nasa-neows-feed
    description: "Get NASA NeoWs (Near-Earth Objects) Feed. Retrieves asteroids based on closest approach date to Earth. endDate defaults to 7 days after startDate."
    input_schema:
      type: object
      properties:
        startDate:
          type: string
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
          description: "Start date in YYYY-MM-DD format. Defaults to today."
        endDate:
          type: string
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
          description: "End date in YYYY-MM-DD format. Defaults to 7 days after startDate."
    output:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            neos:
              type: object
              properties:
                element_count:
                  type: number
                near_earth_objects:
                  type: object
                  additionalProperties:
                    type: array
                    items:
                      type: object
                      properties: {}
                      additionalProperties: true
              additionalProperties: true
          required:
            - neos
          additionalProperties: false
        error:
          type: string
      required:
        - success

  nasa_neows_lookup:
    method: POST
    endpoint: /nasa-neows-lookup
    description: "Lookup a specific Near-Earth Object by its NASA JPL small body (SPK-ID) ID"
    input_schema:
      type: object
      properties:
        asteroidId:
          type: string
          minLength: 1
          description: "Asteroid SPK-ID (NASA JPL small body ID)"
      required:
        - asteroidId
    output:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
        error:
          type: string
      required:
        - success
    output_description: "data contains: { neo: Single asteroid object with detailed information }"

  nasa_neows_browse:
    method: POST
    endpoint: /nasa-neows-browse
    description: "Browse the overall Near-Earth Objects data-set"
    input_schema:
      type: object
      properties:
        page:
          type: integer
          minimum: 0
          description: "Page number (0-indexed)"
        size:
          type: integer
          minimum: 1
          maximum: 20
          description: "Page size (1-20)"
    output:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
        error:
          type: string
      required:
        - success
    output_description: "data contains: { neos: NeoWs browse response with paginated asteroid data }"
