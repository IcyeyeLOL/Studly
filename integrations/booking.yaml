        description:
          type: string
          description: Event description
        startTime:
          type: string
          format: "date-time"
          description: Start time (ISO string)
        endTime:
          type: string
          format: "date-time"
          description: End time (ISO string)
        guestEmail:
          type: string
          format: email
          description: Guest email to send invite to
        addVideoConferencing:
          type: boolean
          description: Whether to add Google Meet
      required:
        - hostClerkUserId
        - title
        - startTime
        - endTime
        - guestEmail
    output:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            eventId:
              type: string
            htmlLink:
              type: string
            meetLink:
              type: string
            hostNotConnected:
              type: boolean
            rateLimited:
              type: boolean
          additionalProperties: false
        error:
          type: string
      required:
        - success
