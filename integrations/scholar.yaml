    description: "Get detailed citation information"
    input_schema:
      type: object
      properties:
        citationId:
          type: string
          minLength: 1
      required:
        - citationId
    output:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            citation:
              type: object
              properties: {}
              additionalProperties: true
          required:
            - citation
          additionalProperties: false
        error:
          type: string
      required:
        - success

  scholar_summarize_papers:
    method: POST
    endpoint: /scholar-summarize-papers
