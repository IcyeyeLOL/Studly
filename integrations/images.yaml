    method: POST
    endpoint: /generate-image
    description: "[DEPRECATED — prefer using newer models instead like Gemini] Generate image from prompt (async)"
    input_schema:
      type: object
      properties:
        prompt:
          type: string
          minLength: 1
        reference_images:
          type: array
          items:
            type: string
      required:
        - prompt
    output:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            imageUrls:
              type: array
              items:
                type: string
            taskId:
              type: string
          additionalProperties: false
        error:
          type: string
      required:
        - success

  generate_image_classic:
    method: POST
    endpoint: /generate-image-classic
    description: "Generate image from text with full parameter control (classic fast model)"
    input_schema:
      type: object
      properties:
        prompt:
          type: string
          minLength: 3
        negative_prompt:
          type: string
          minLength: 3
        styling:
          type: object
          properties:
            style:
              type: string
              enum:
                - photo
                - digital-art
                - 3d
                - painting
                - low-poly
                - pixel-art
                - anime
                - cyberpunk
                - comic
                - vintage
                - cartoon
                - vector
                - studio-shot
