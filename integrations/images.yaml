                  base64:
                    type: string
                  has_nsfw:
                    type: boolean
                required:
                  - base64
                  - has_nsfw
                additionalProperties: false
            imageUrls:
              type: array
              items:
                type: string
            meta: {}
          additionalProperties: false
        error:
