          items:
            type: string
            minLength: 1
          description: List of domains to include in search results
        excludeDomains:
          type: array
          items:
            type: string
            minLength: 1
          description: List of domains to exclude from search results
        startPublishedDate:
          type: string
          description: Only links published after this date (ISO 8601 format)
        endPublishedDate:
          type: string
          description: Only links published before this date (ISO 8601 format)
        includeText:
          type: array
          items:
            type: string
            minLength: 1
          maxItems: 1
          description: Text that must be present in webpage (max 1 string, up to 5 words)
        excludeText:
          type: array
          items:
            type: string
            minLength: 1
          maxItems: 1
          description: Text that must NOT be present in webpage (max 1 string, up to 5 words)
        contents:
          type: object
          properties:
            text:
              anyOf:
                - 
                  type: boolean
                - 
                  type: object
                  properties:
                    maxCharacters:
                      type: integer
                      exclusiveMinimum: 0
                      description: Maximum character limit for full page text (controls response size and API costs)
                    includeHtmlTags:
                      type: boolean
                      default: false
                      description: Include HTML tags to help LLMs understand text structure
                  additionalProperties: false
              default: true
              description: Return full page text (boolean) or advanced text options (object)
            highlights:
              type: object
              properties:
                numSentences:
                  type: integer
                  minimum: 1
                  default: 1
                  description: Number of sentences per highlight snippet
                highlightsPerUrl:
                  type: integer
                  minimum: 1
                  default: 1
                  description: Number of highlight snippets per result
              additionalProperties: false
              description: Text snippets identified as most relevant
            summary:
              type: object
              properties:
                query:
                  type: string
                  description: "Custom query for LLM-generated summary"
              additionalProperties: false
              description: Summary of the webpage
            extras:
              type: object
              properties:
                links:
                  type: integer
                  minimum: 0
                  default: 0
                  description: Number of URLs to return from each webpage
                imageLinks:
                  type: integer
                  minimum: 0
                  default: 0
                  description: Number of images to return for each result
              additionalProperties: false
              description: Additional content to extract
          additionalProperties: false
          description: Content extraction options
        context:
          type: boolean
          default: false
          description: Return page contents as a combined context string for LLM (combines all results)
        moderation:
          type: boolean
          default: false
          description: Enable content moderation to filter unsafe content
      required:
        - query
    output:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            results:
              type: array
              items:
                type: object
                properties:
                  title:
                    type: string
                  url:
                    type: string
                  publishedDate:
                    type:
                      - string
                      - null
                  author:
                    type:
                      - string
                      - null
                  id:
                    type: string
                  image:
                    type: string
                  favicon:
                    type: string
                  text:
                    type: string
                  highlights:
                    type: array
                    items:
                      type: string
                  summary:
                    type: string
                  extras:
                    type: object
                    properties:
                      links:
                        type: array
                        items:
                          type: string
                      imageLinks:
                        type: array
                        items:
                          type: string
                    additionalProperties: false
                required:
                  - title
                  - url
