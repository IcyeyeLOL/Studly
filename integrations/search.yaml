# search integration endpoints
# Auto-generated from route-owned Zod schemas

# USAGE: Call using miyagiAPI:
#   miyagiAPI.post('/endpoint', { ...params })
#   miyagiAPI.get('/endpoint', { ...params })

tools:

  search_web:
    method: POST
    endpoint: /search-web
    description: "Search web pages and get AI-summarized content with citations"
    input_schema:
      type: object
      properties:
        searchPrompt:
          type: string
          minLength: 1
        queryHints:
          type: array
          items:
            type: string
            minLength: 1
          default: []
        count:
          type: integer
          minimum: 1
          maximum: 10
          default: 5
        parseResultsPrompt:
          type: string
        constraints:
          type: object
          properties:
            allowDomains:
              type: array
              items:
                type: string
                minLength: 1
            denyDomains:
              type: array
              items:
                type: string
                minLength: 1
            dateRange:
              type: object
              properties:
                from:
                  type: string
                to:
                  type: string
              additionalProperties: false
            safe:
              type: boolean
          additionalProperties: false
      required:
        - searchPrompt
    output:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
        error:
          type: string
      required:
        - success
    output_description: "data contains: { summary, citations[], sources[] }"

  search_web_raw:
    method: POST
    endpoint: /search-web-raw
    description: "Search web pages and return raw results without AI summarization (includes extracted text)"
    input_schema:
      type: object
      properties:
        searchPrompt:
          type: string
          minLength: 1
        queryHints:
          type: array
          items:
            type: string
            minLength: 1
