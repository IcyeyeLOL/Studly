                minLength: 1
            denyDomains:
              type: array
              items:
                type: string
                minLength: 1
            dateRange:
              type: object
              properties:
                from:
                  type: string
                to:
                  type: string
              additionalProperties: false
            safe:
              type: boolean
          additionalProperties: false
        aiPrompt:
          type: string
          minLength: 1
