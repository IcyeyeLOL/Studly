  exa_research:
    method: POST
    endpoint: /exa-research
    description: "Create a research task that explores the web, gathers sources, and synthesizes findings. Waits for completion and returns the full research content. Research can take up to 10 minutes for complex queries."
    input_schema:
      type: object
      properties:
        instructions:
          type: string
          minLength: 1
          maxLength: 4096
          description: Instructions for what you would like research on. Clearly define what information you want to find, how research should be conducted, and what the output should look like.
        model:
          type: string
          enum:
            - exa-research-fast
            - exa-research
            - exa-research-pro
          default: "exa-research"
          description: "Research model: exa-research (default) is balanced, exa-research-fast is faster and cheaper, exa-research-pro provides more thorough analysis"
        outputSchema:
          type: object
          additionalProperties: {}
          description: JSON Schema to enforce structured output. When provided, the research output will be validated against this schema and returned as parsed JSON.
      required:
        - instructions
    output:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            researchId:
              type: string
              description: Unique identifier for the research request
            status:
              type: string
              enum:
                - pending
                - running
                - completed
                - failed
                - canceled
              description: Final status of the research task
            content:
              type: string
              description: The complete research output as text
            parsed:
              type: object
              additionalProperties: {}
              description: Structured JSON object matching outputSchema (only present when outputSchema was provided)
            output:
              type: object
              properties:
                content:
                  type: string
                  description: The complete research output as text
                parsed:
                  type: object
                  additionalProperties: {}
                  description: Structured JSON object matching outputSchema
              required:
                - content
              additionalProperties: false
              description: Research output matching Exa API structure
            costDollars:
              type: object
              properties:
                total:
                  type: number
                numSearches:
                  type: number
                numPages:
                  type: number
                reasoningTokens:
                  type: number
              required:
                - total
              additionalProperties: false
              description: Actual cost breakdown in USD for this research request
            usageId:
              type: string
          additionalProperties: false
        error:
          type: string
      required:
        - success

