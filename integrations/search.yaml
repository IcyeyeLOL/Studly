                    type: string
                  title:
                    type: string
                  snippet:
                    type: string
                  extractedText:
                    type: string
                required:
                  - url
                additionalProperties: false
            query:
              type: string
          additionalProperties: false
        error:
          type: string
      required:
        - success

  exa_search:
