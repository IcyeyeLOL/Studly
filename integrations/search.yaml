        constraints:
          type: object
          properties:
            allowDomains:
              type: array
              items:
                type: string
                minLength: 1
            denyDomains:
              type: array
              items:
                type: string
                minLength: 1
            dateRange:
              type: object
              properties:
                from:
                  type: string
                to:
                  type: string
              additionalProperties: false
            safe:
              type: boolean
          additionalProperties: false
      required:
        - searchPrompt
    output:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
        error:
          type: string
      required:
        - success
    output_description: "data contains: { sources[{ url, title, snippet, extractedText }], query }"

  search_web_ai:
    method: POST
    endpoint: /search-web-ai
    description: "Search web pages and process results with ChatGPT using custom prompt"
    input_schema:
      type: object
      properties:
        searchPrompt:
          type: string
          minLength: 1
        queryHints:
          type: array
          items:
            type: string
            minLength: 1
          default: []
        count:
          type: integer
          minimum: 1
          maximum: 10
          default: 5
        constraints:
          type: object
          properties:
            allowDomains:
              type: array
              items:
                type: string
                minLength: 1
            denyDomains:
              type: array
              items:
                type: string
                minLength: 1
            dateRange:
              type: object
              properties:
                from:
                  type: string
                to:
                  type: string
              additionalProperties: false
            safe:
              type: boolean
          additionalProperties: false
        aiPrompt:
          type: string
          minLength: 1
        provider:
          type: string
          enum:
            - openai
            - anthropic
          default: openai
        model:
          type: string
        max_tokens:
          type: integer
          exclusiveMinimum: 0
          maximum: 200000
          default: 16000
        temperature:
          type: number
          minimum: 0
          maximum: 2
          default: 0.7
      required:
        - searchPrompt
        - aiPrompt
    output:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            aiResponse:
              type: string
            sources:
              type: array
              items:
                type: object
                properties:
                  url:
                    type: string
                  title:
                    type: string
                  snippet:
                    type: string
                  extractedText:
                    type: string
                required:
                  - url
                additionalProperties: false
            query:
              type: string
          additionalProperties: false
        error:
          type: string
      required:
        - success

