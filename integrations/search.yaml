  exa_answer:
    method: POST
    endpoint: /exa-answer
    description: "Get an LLM answer to a question informed by Exa search results. Performs search and generates either a direct answer for specific queries or a detailed summary with citations for open-ended queries."
    input_schema:
      type: object
      properties:
        query:
          type: string
          minLength: 1
          description: The question or query to answer
        text:
          type: boolean
          default: false
          description: Include full text content in the citations
      required:
        - query
    output:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            answer:
              type: string
              description: The generated answer based on search results
            citations:
              type: array
