# formula1 integration endpoints
# Auto-generated from route-owned Zod schemas

# USAGE: import { mcapi } from '@spaces/sdk'
#   mcapi.post('/endpoint', { ...params })
#   mcapi.get('/endpoint', { ...params })

tools:

  f1_season_schedule:
    method: POST
    endpoint: /f1-season-schedule
    description: "Get complete F1 season schedule with all race dates, circuits, and session times for a given year"
    input_schema:
      type: object
      properties:
        season:
          type: integer
          minimum: 1950
          maximum: 2100
          description: Year of the F1 season (e.g., 2025, 2024)
      required:
        - season
    output:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            schedule:
              type: array
              items:
                type: object
                properties:
                  round:
                    type: string
                  raceName:
                    type: string
                  Circuit:
                    type: object
                    properties: {}
                    additionalProperties: true
                  date:
                    type: string
                  time:
                    type: string
                required:
                  - round
                  - raceName
                  - Circuit
                  - date
                additionalProperties: true
          required:
            - schedule
          additionalProperties: false
        error:
          type: string
      required:
        - success

