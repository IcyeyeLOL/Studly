tools:

  polymarket_events:
    method: GET
    endpoint: /polymarket-events
    description: "Get prediction market events from Polymarket. Events group related markets (e.g., \"2024 Election\" contains multiple questions). Returns event details with volume, liquidity, active status, and all associated markets."
    input_schema:
      type: object
      properties:
        active:
          type: boolean
          description: Filter for active events
        closed:
          type: boolean
          description: Filter for closed events
        archived:
          type: boolean
          description: Filter for archived events
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
          description: Number of results to return
        offset:
          type: integer
          minimum: 0
          default: 0
          description: Pagination offset
        order:
          type: string
          description: Field to order by
        ascending:
          type: boolean
          description: Sort ascending
        tag_slug:
          type: string
          description: Filter by tag slug
        slug:
          type: string
          description: Filter by event slug
    output:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            events:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  slug:
                    type: string
                  title:
                    type: string
                  description:
                    type: string
                  startDate:
                    type: string
                  endDate:
                    type: string
                  image:
                    type: string
                  icon:
                    type: string
                  active:
                    type: boolean
                  closed:
                    type: boolean
                  liquidity:
                    type: number
                  volume:
                    type: number
                  volume24hr:
                    type: number
                  markets:
                    type: array
                    items:
                      type: object
                      properties: {}
                      additionalProperties: true
                  tags:
                    type: array
                    items:
                      type: object
                      properties: {}
                      additionalProperties: true
                required:
                  - id
                additionalProperties: true
            limit:
              type: number
            offset:
              type: number
            count:
              type: number
          additionalProperties: false
        error:
          type: string
      required:
        - success

