    description: "Get historical price data for a Polymarket market showing how outcome probabilities changed over time. Returns time-series data with configurable intervals (1m to 1w)"
    input_schema:
      type: object
      properties:
        market:
          type: string
          minLength: 1
          description: Market condition ID
        interval:
          type: string
          enum:
            - 1m
            - 5m
            - 15m
            - 1h
            - 4h
            - 1d
