    description: "Get current price for a Polymarket outcome token. Prices represent market probability (0-1) for that outcome. Side parameter is required per Polymarket API docs."
    input_schema:
      type: object
      properties:
        token_id:
          type: string
          minLength: 1
          description: Token ID to get price for
        side:
          type: string
          enum:
            - BUY
            - SELL
          description: "Side of the market (BUY or SELL) - required"
      required:
