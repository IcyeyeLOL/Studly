          default: 1d
          description: Time interval for data points
        fidelity:
          type: integer
          minimum: 1
          maximum: 1000
          default: 60
          description: Number of data points
        startTs:
          type: integer
          description: Start timestamp (Unix seconds)
        endTs:
          type: integer
          description: End timestamp (Unix seconds)
      required:
