    method: GET
    endpoint: /polymarket-prices
    description: "Get current prices for multiple Polymarket outcome tokens in batch. Uses POST /prices endpoint internally. Returns prices keyed by token_id with BUY/SELL nested values."
    input_schema:
      type: object
      properties:
        token_ids:
          type: string
          minLength: 1
          description: "Comma-separated list of token IDs"
        side:
          type: string
          enum:
            - BUY
            - SELL
          description: "Optional: Side to get prices for (BUY or SELL). If omitted, returns both sides."
      required:
